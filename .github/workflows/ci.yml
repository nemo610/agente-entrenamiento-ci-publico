name: Public Safe CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 12 * * 1"

permissions:
  contents: read

concurrency:
  group: public-safe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests and package build (offline only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" build
      - name: Compile Python files
        run: python -m compileall -q src tests
      - name: Run tests and generate report
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build distributable package
        run: python -m build
      - name: Upload test report and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-python-3.12
          path: |
            test-results.xml
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
