[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-entrenamiento-ci-publico"
version = "0.1.0"
description = "Pruebas públicas y aisladas de integración continua para un proyecto de investigación de trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["safe_risk_checks"]
